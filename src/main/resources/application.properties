spring.application.name=backend
# ==========================================
# InstantDRS - Database Configuration
# ==========================================

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/instant_drs?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=${DB_PASSWORD}
# Automatically create/update tables during development
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console
spring.jpa.show-sql=true

# Format SQL queries
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Server
# ==========================================

server.port=8080