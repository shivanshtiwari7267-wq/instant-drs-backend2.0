spring.application.name=instantdrs-backend
# ==========================================
# InstantDRS - Database Configuration
# ==========================================

# MySQL Database (Local Dev Defaults with Env Var Overrides)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/instant_drs?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Automatically create/update tables during development
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console
spring.jpa.show-sql=true

# Format SQL queries
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Server
# ==========================================
server.port=${PORT:8080}

# ==========================================
# InstantDRS - Video Engine Configuration
# ==========================================
instantdrs.video-engine.python=${VIDEO_ENGINE_PYTHON:C:/Users/Shivansh Tiwari/Desktop/InstantDRS/video-engine/tool3-sports-ball-tracking/.venv/Scripts/python.exe}
instantdrs.video-engine.pipeline=${VIDEO_ENGINE_PIPELINE:C:/Users/Shivansh Tiwari/Desktop/InstantDRS/video-engine/pipeline/run_pipeline.py}
instantdrs.video-engine.fast-pipeline=${VIDEO_ENGINE_FAST_PIPELINE:C:/Users/Shivansh Tiwari/Desktop/InstantDRS/video-engine/pipeline/fast_drs_pipeline.py}
instantdrs.video-engine.use-fast-pipeline=${VIDEO_ENGINE_USE_FAST:true}
instantdrs.storage.original-dir=${STORAGE_ORIGINAL_DIR:storage/original/}
instantdrs.storage.processed-dir=${STORAGE_PROCESSED_DIR:storage/processed/}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:100MB}