spring.application.name=instantdrs-backend

# ==========================================
# Production Database
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Production schema handling
spring.jpa.hibernate.ddl-auto=validate

# Disable SQL output
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# Server
# ==========================================
server.port=${PORT:8080}

# ==========================================
# Video Engine
# ==========================================
instantdrs.video-engine.python=${VIDEO_ENGINE_PYTHON}
instantdrs.video-engine.pipeline=${VIDEO_ENGINE_PIPELINE}
instantdrs.video-engine.fast-pipeline=${VIDEO_ENGINE_FAST_PIPELINE}
instantdrs.video-engine.use-fast-pipeline=${VIDEO_ENGINE_USE_FAST:true}

# ==========================================
# Storage
# ==========================================
instantdrs.storage.original-dir=${STORAGE_ORIGINAL_DIR:storage/original/}
instantdrs.storage.processed-dir=${STORAGE_PROCESSED_DIR:storage/processed/}

# ==========================================
# Upload limits
# ==========================================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:100MB}

# ==========================================
# Production logging
# ==========================================
logging.level.root=INFO
logging.level.com.instantdrs.backend=INFO

spring.jpa.open-in-view=false
